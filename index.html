<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equalizer Mixer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="header-icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 14 L10 8 L16 18 L22 10 L28 14" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M0 14 L6 10 L12 16 L18 6 L24 12 L28 14" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>
        </svg>
      </div>
      <h1>Equalizer Mixer</h1>
      <p class="subtitle">2つのEQ設定をミックスして合成カーブを生成します</p>
    </header>

    <main class="main">

      <!-- EQ Panels -->
      <div class="eq-panels">

        <!-- EQ 1 -->
        <div class="panel eq1" id="panel-eq1">
          <div class="panel-header">
            <div class="eq-label">
              <span class="eq-dot"></span>
              EQ 1
            </div>
            <div class="header-actions">
              <button class="btn-ghost" id="import-eq1">インポート</button>
              <button class="btn-ghost" id="clear-eq1">クリア</button>
            </div>
          </div>
          <div class="bands-header">
            <span>周波数</span>
            <span>ゲイン</span>
          </div>
          <div class="band-list" id="bands-eq1"></div>
          <button class="btn-add" id="add-eq1">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            バンドを追加
          </button>
        </div>

        <!-- EQ 2 -->
        <div class="panel eq2" id="panel-eq2">
          <div class="panel-header">
            <div class="eq-label">
              <span class="eq-dot"></span>
              EQ 2
            </div>
            <div class="header-actions">
              <button class="btn-ghost" id="import-eq2">インポート</button>
              <button class="btn-ghost" id="clear-eq2">クリア</button>
            </div>
          </div>
          <div class="bands-header">
            <span>周波数</span>
            <span>ゲイン</span>
          </div>
          <div class="band-list" id="bands-eq2"></div>
          <button class="btn-add" id="add-eq2">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            バンドを追加
          </button>
        </div>

      </div>

      <!-- Chart -->
      <div class="panel chart-panel">
        <div class="panel-header">
          <h2 class="panel-title">ミックスカーブ</h2>
          <div class="legend">
            <div class="legend-item eq1-legend">
              <span class="legend-line dashed"></span>
              <span>EQ 1</span>
            </div>
            <div class="legend-item eq2-legend">
              <span class="legend-line dashed"></span>
              <span>EQ 2</span>
            </div>
            <div class="legend-item mixed-legend">
              <span class="legend-line"></span>
              <span>ミックス</span>
            </div>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="eq-chart"></canvas>
        </div>
      </div>

      <!-- Query -->
      <div class="panel query-panel">
        <div class="panel-header">
          <h2 class="panel-title">ゲインを取得</h2>
          <div class="header-actions">
            <label class="decimal-label" for="decimal-places">小数点</label>
            <select id="decimal-places" class="select-decimal">
              <option value="0">0桁</option>
              <option value="1" selected>1桁</option>
              <option value="2">2桁</option>
              <option value="3">3桁</option>
            </select>
            <button class="btn-ghost" id="export-btn">エクスポート</button>
          </div>
        </div>
        <!-- 入力フォーム（常に最上部） -->
        <div class="query-form-row">
          <div class="query-input-wrap">
            <input
              type="number"
              id="query-freq-input"
              class="query-input"
              placeholder="1000"
              min="1" max="96000" step="1"
              aria-label="周波数 (Hz)"
            >
            <span class="query-unit">Hz</span>
          </div>
          <button class="btn-primary" id="query-submit-btn">取得</button>
        </div>
        <!-- 取得結果（1件以上あるとき表示） -->
        <div id="query-results-section" hidden>
          <div class="query-divider"></div>
          <div id="query-results-list" class="query-results-list"></div>
        </div>
      </div>

    </main>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">インポート</h3>
        <button class="modal-close" id="modal-close" aria-label="閉じる">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <p class="modal-field-label">ファイル形式</p>
          <div class="modal-radios">
            <label class="modal-radio-label">
              <input type="radio" name="modal-format" value="feq" checked>
              <span>.feq（Foobar2000 標準 EQ）</span>
            </label>
            <label class="modal-radio-label">
              <input type="radio" name="modal-format" value="xgeq">
              <span>.xgeq（Foobar2000 GraphicEQ）</span>
            </label>
          </div>
        </div>
        <div id="modal-file-field" class="modal-field">
          <label class="modal-field-label" for="modal-file-input">ファイル</label>
          <input type="file" id="modal-file-input" class="modal-file-input" accept=".feq,.xgeq">
        </div>
        <p id="modal-error" class="modal-error" hidden></p>
      </div>
      <div class="modal-footer">
        <button class="btn-ghost" id="modal-cancel">キャンセル</button>
        <button class="btn-primary" id="modal-confirm">実行</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
